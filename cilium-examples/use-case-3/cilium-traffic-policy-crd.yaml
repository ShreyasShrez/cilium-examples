# Custom CiliumTrafficPolicy CRD for advanced traffic management
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumtrafficpolicies.cilium.io
spec:
  group: cilium.io
  versions:
  - name: v2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              destinationSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
              rules:
                type: array
                items:
                  type: object
                  properties:
                    matches:
                      type: array
                      items:
                        type: object
                        properties:
                          headers:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                value:
                                  type: string
                    backendRefs:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          port:
                            type: integer
                          weight:
                            type: integer
                        required:
                        - name
                        - port
                    loadBalancer:
                      type: object
                      properties:
                        type:
                          type: string
                        healthCheck:
                          type: object
                          properties:
                            path:
                              type: string
                            interval:
                              type: string
                            timeout:
                              type: string
                    circuitBreaker:
                      type: object
                      properties:
                        consecutiveErrors:
                          type: integer
                        timeout:
                          type: string
                        maxRequests:
                          type: integer
                    retry:
                      type: object
                      properties:
                        attempts:
                          type: integer
                        perTryTimeout:
                          type: string
                        retryOn:
                          type: string
                    timeout:
                      type: string
  scope: Namespaced
  names:
    plural: ciliumtrafficpolicies
    singular: ciliumtrafficpolicy
    kind: CiliumTrafficPolicy
    shortNames:
    - ctp
