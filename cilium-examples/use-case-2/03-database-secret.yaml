# Use Case 2: Database Secret
# This file contains ONLY the secret - the deployment is in 03-database.yaml

apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded password: "secure-password-123"
  # To encode: echo -n "secure-password-123" | base64
  postgres-password: c2VjdXJlLXBhc3N3b3JkLTEyMw==
  # Base64 encoded username: "postgres"
  # To encode: echo -n "postgres" | base64
  postgres-user: cG9zdGdyZXM=
